uid: SR-0021
type: system_requirement
status: proposed
title: Keep the run stage to as few moving parts as possible
text: Keep the run stage to as few moving parts as possible, since problems that
  prevent an app from running can cause it to break in the middle of the night when
  no developer is on hand; the build stage may be more complex.
normative: true
links:
