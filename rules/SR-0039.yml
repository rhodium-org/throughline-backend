uid: SR-0039
type: system_requirement
status: approved
title: Deploy in hours and keep developers close to production
text: >-
  Close the time gap by making code written go into production in hours or minutes, and
  close the personnel gap by keeping the developers who wrote the code closely involved in
  deploying it and watching its behaviour in production.
