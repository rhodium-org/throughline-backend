uid: SR-0034
type: system_requirement
status: approved
title: Make processes disposable, startable and stoppable at will
text: >-
  Make processes disposable, meaning they can be started or stopped at a moment's notice,
  which facilitates fast elastic scaling, rapid deployment of changes and robustness of
  production deploys.
