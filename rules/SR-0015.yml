uid: SR-0015
type: system_requirement
status: approved
title: Allow resources to be attached and detached at will
text: >-
  Allow resources to be attached to and detached from a deploy at will; a failed database
  can be replaced with a restored backup by changing only the config resource handle, with
  no code change.
