uid: SR-0046
type: system_requirement
status: proposed
title: Ship admin code with the application code
text: Ship admin code with the application code and commit one-time scripts into
  the app's repo to avoid synchronization problems; the methodology favours languages
  that provide a REPL shell and make one-off scripts easy to run.
normative: true
