uid: SR-0013
type: system_requirement
status: proposed
title: Treat every backing service as an attached resource
text: Treat every backing service — datastore, message queue, SMTP, cache — as an
  attached resource accessed via a URL or other locator and credentials stored in
  the config.
normative: true
