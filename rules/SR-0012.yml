uid: SR-0012
type: system_requirement
status: proposed
title: Use granular, orthogonal environment variables
text: Manage config as granular environment variables that are fully orthogonal to
  one another, set independently per deploy, rather than grouping them into named
  environments that do not scale as deploys multiply.
normative: true
