uid: SR-0009
type: system_requirement
status: proposed
title: Store config that varies per deploy in the environment
text: Store everything likely to vary between deploys — resource handles, external
  service credentials and per-deploy values such as the hostname — in environment
  variables, not in the code.
normative: true
