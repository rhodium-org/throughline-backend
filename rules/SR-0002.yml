uid: SR-0002
type: system_requirement
status: proposed
title: Keep a one-to-one correlation between codebase and app
text: Keep a strict one-to-one correlation between the codebase and the app; if there
  are multiple codebases it is a distributed system, not one app, and each component
  is its own twelve-factor app.
normative: true
